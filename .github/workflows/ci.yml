name: CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - backend/**
      - frontend/**
      - ai/**
      - infrastructure/**
      - .github/workflows/**
  pull_request:
    branches: [main, develop]
    paths:
      - backend/**
      - frontend/**
      - ai/**
      - infrastructure/**
      - .github/workflows/**

jobs:
  backend:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Tests
        run: mvn verify -B

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        run: |
          npm ci
          npm run build

  ai:
    name: AI Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
      # pytest sẽ thêm sau khi có test/

  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai]
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend image
        run: docker build -t symphony-backend:${{ github.sha }} ./backend

      - name: Build Frontend image
        run: docker build -t symphony-frontend:${{ github.sha }} ./frontend

      - name: Build AI image
        run: docker build -t symphony-ai:${{ github.sha }} ./ai
